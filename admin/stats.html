<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Метрики — Твоє право</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg:#f7f6f2; --surface:#fff; --surface-2:#f0efea; --border:#ddd; --text:#1d1d1b; --muted:#777; --accent:#185fa5; --ok:#0f6e56; --warn:#854f0b; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#161614; --surface:#1f1f1d; --surface-2:#2a2a27; --border:#333; --text:#f0efeb; --muted:#999; --accent:#85b7eb; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:15px; line-height:1.5; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:26px 0 10px; }
  nav a { color:var(--accent); text-decoration:none; font-size:13px; margin-left:14px; }
  main { max-width:820px; margin:0 auto; padding:16px 20px 80px; }
  .meta { font-size:13px; color:var(--muted); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:14px; }
  .tile { border:1px solid var(--border); border-radius:10px; background:var(--surface); padding:14px 16px; }
  .tile .num { font-size:26px; font-weight:600; }
  .tile .lbl { font-size:12.5px; color:var(--muted); margin-top:2px; }
  table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--border); font-size:14px; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .bars { display:flex; flex-direction:column; gap:5px; }
  .bar-row { display:grid; grid-template-columns:78px 1fr 44px; align-items:center; gap:10px; font-size:12.5px; }
  .bar-track { background:var(--surface-2); border-radius:4px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--accent); border-radius:4px; }
  .bar-row .val { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); }
  .msg { color:var(--muted); padding:20px 0; }
  code { font-size:12.5px; background:var(--surface-2); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>📊 Метрики</h1>
  <nav><a href="/admin/moderation.html">🛡️ Модерація</a></nav>
</header>
<main>
  <p class="meta">Агреговані лічильники подій. Без IP, cookie й персональних даних — лише «скільки разів». Час — UTC.</p>
  <div id="content"><p class="msg">Завантаження…</p></div>
</main>
<script src="/js/lawyers-data.js"></script>
<script>
const esc = (s) => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const lawyerName = (id) => {
  const l = (window.LAWYERS||[]).find(x => x.id === id);
  return l ? l.name : id;
};
async function api(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function sum(rows){ return rows.reduce((a,r)=>a+(r.total||0),0); }
function tiles(d){
  const tot = {};
  (d.totals||[]).forEach(r => tot[r.name] = r.total||0);
  const last7 = (d.daily||[]).slice(0,7).reduce((a,r)=>a+(r.total||0),0);
  const t = (num,lbl) => `<div class="tile"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
  return `<div class="tiles">
    ${t(tot.pageview||0, "переглядів сторінок")}
    ${t(last7, "переглядів за 7 днів")}
    ${t(tot.lawyer_view||0, "показів карток адвокатів")}
    ${t(tot.lawyer_call||0, "кліків по телефону")}
  </div>`;
}
function dailyBars(daily){
  if(!daily.length) return "";
  const rows = daily.slice().reverse(); // від старих до нових
  const max = Math.max(...rows.map(r=>r.total||0), 1);
  return `<h2>Перегляди по днях</h2><div class="bars">${rows.map(r=>{
    const pct = Math.round((r.total||0)/max*100);
    return `<div class="bar-row"><span class="meta">${esc(r.day)}</span><span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span><span class="val">${r.total||0}</span></div>`;
  }).join("")}</div>`;
}
function pagesTable(pages){
  if(!pages.length) return "";
  return `<h2>Сторінки</h2><table><thead><tr><th>Шлях</th><th style="text-align:right">Переглядів</th></tr></thead><tbody>${
    pages.map(r=>`<tr><td><code>${esc(r.target||"/")}</code></td><td class="n">${r.total||0}</td></tr>`).join("")
  }</tbody></table>`;
}
function lawyersTable(views, calls){
  // Об'єднуємо показ+дзвінки по id адвоката; сортуємо за показами.
  const byId = {};
  (views||[]).forEach(r => { (byId[r.target] = byId[r.target] || {views:0,calls:0}).views = r.total||0; });
  (calls||[]).forEach(r => { (byId[r.target] = byId[r.target] || {views:0,calls:0}).calls = r.total||0; });
  // Показуємо і адвокатів із каталогу, у кого ще 0 подій.
  (window.LAWYERS||[]).forEach(l => { byId[l.id] = byId[l.id] || {views:0,calls:0}; });
  const rows = Object.keys(byId).map(id => ({ id, ...byId[id] }))
    .sort((a,b) => b.views - a.views || b.calls - a.calls);
  if(!rows.length) return `<h2>По кожному адвокату</h2><p class="msg">Ще немає даних.</p>`;
  return `<h2>По кожному адвокату</h2><table><thead><tr>
      <th>Адвокат</th>
      <th style="text-align:right">Показів</th>
      <th style="text-align:right">Дзвінків</th>
      <th style="text-align:right">Конверсія</th>
    </tr></thead><tbody>${
    rows.map(r=>{
      const cr = r.views ? Math.round(r.calls/r.views*100) : 0;
      return `<tr>
        <td>${esc(lawyerName(r.id))} <span class="meta">(${esc(r.id)})</span></td>
        <td class="n">${r.views}</td>
        <td class="n">${r.calls}</td>
        <td class="n">${r.views ? cr+"%" : "—"}</td>
      </tr>`;
    }).join("")
  }</tbody></table><p class="meta" style="margin-top:8px">Показ — картку адвоката побачили на екрані (раз на відкриття сторінки). Конверсія — дзвінки ÷ покази.</p>`;
}
(async function(){
  const el = document.getElementById("content");
  try {
    const d = await api("/api/mod/stats");
    const empty = !(d.totals||[]).length;
    el.innerHTML = empty
      ? `<p class="msg">Даних ще немає — метрики почнуть накопичуватися після відвідувань.</p>`
      : tiles(d) + dailyBars(d.daily||[]) + pagesTable(d.pages||[]) + lawyersTable(d.lawyerViews||[], d.lawyerCalls||[]);
  } catch(e){
    el.innerHTML = `<p class="msg">Не вдалося завантажити (${esc(e.message)}). Перевір, що /admin/* і /api/mod/* за Cloudflare Access і D1 налаштовано.</p>`;
  }
})();
</script>
</body>
</html>
